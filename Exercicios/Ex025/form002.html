<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulario</title>
    <Style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        form{
            width: 300px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.603);
            border: 1px solid black;
            padding: 10px;
            margin: auto;
        }

        h1{
            text-align: center;
        }
    </Style>
</head>
<body>
    <h1>Teste com Formulários</h1>
    <form action="cadastro.php" method="POST">
    <p>
        <label for="iusu">Usuário: </label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15">
    </p>
    <p>
        <label for="isen">Senha: </label>
        <input type="password" name="sen" id="isen" required minlength="8" maxlength="20">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
