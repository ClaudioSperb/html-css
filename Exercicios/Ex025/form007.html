<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        
    </style>
</head>
<body>
    <h1>Exemplos de Formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iestado">Estado:</label>
            <select name="Estado" id="iestado">
                <option value="">---Escolha---</option>
                <optgroup label="Região Sul">
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="PR">Paraná</option>
                </optgroup>
                <optgroup label="Região Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>
                <optgroup label="Região Nordeste">
                    <option value="BA">Bahia</option>
                    <option value="PA">Pará</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>
            </select>
            <!-- Aqui utilizamos a propriedade SELECT, com abertura e fechamento. Dentro do SELECT colocamos a propriedade OPTION com abertura e fechamento da tag. o Label é excenssial sempre colocar. Nesse exemplom dentro da tah OPTGROUP coloca-se o label mas como um elemento, nesse caso fazendo a função de uma legenda. -->
        </p>
        <p>
            <label for="iprof">Profissão:</label>
            <input type="text" name="prof" id="iprof" list="listaprof">
            <datalist id="listaprof">
                <option>Administração</option>
                <option>Mecânico</option>
                <option>Professor</option>
                <option>Desenvolvedor</option>
                <option>Motorista</option>
            </datalist>
        </p>
        <!-- Já nessa lista, usamos um INPUT TEXT e adicionamos um elemento LIST, para que o usuário consiga digitar tambemm alem de conter a lista criada. -->

        <!-- Criamos o DATALIST e adicionamos alguns OPTION - adicionando o ID com o mesmo nome dado a LIST. -->

        <p>
            <label for="imsg">Mensagem:</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
            <!-- Aqui adicionamos o cols e o rows, para limitar o numero de colunas e linhas. -->
        </p>
        <!-- Quando usado o textarea utilize o method post -->

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
    </form>



</body>
</html>
