<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        form{
            width: 200px;
            padding: 10px;
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.692);
        }
    </style>
</head>
<body>
    <form action="cadastro.php" autocomplete="off">
        <!--Usamos o autocomplete off para nao ficar as sugestões de nomes ja colocados na caixa do formulário.-->

        <!--Aqui utilizamos o ACTION para dizer ao formulário onde serão armazenados os arquivos do nosso formulário.-->
        <h1>Meu Primeiro Formulário</h1>
        <p><label for="inome">Nome:</label>
            <!--A utilização do label, faz com que aumente a area da caixa, fazendo a ligação entre o nome e o id= inome, como no exemplo abaixo, e da mesma forma no isobrenome!!-->
            <input type="text" name="nome" id="inome">
        </p>
        <p><label for="isobrenome">Sobrenome:</label> 
            <input type="text" name="Sobrenome" id="isobrenome">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

    <!--Para criar um formulário utiliza as tags <form></form>-->
</body>
</html>
