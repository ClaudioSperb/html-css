<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
        }
        form{
            width: 300px;
            border: 1px solid black;
            border-radius: 5px;
            box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.575);
            padding: 10px;
            margin: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>teste de Formulário</h1>
    
    <form action="cadastro.php" method="get" oninput="itot.value = Number(ipreco.value) * Number(iquant.value)">
        <p><label for="iprod">Produto: </label>

        <select name="listaprod" id="lprod">
            <option value="">Item 1</option>
            <option value="">Item 2</option>
            <option value="">Item 3</option>
        </select>

        <p><label for="ipreco">Preço: </label>
        <input type="number" name="preco" id="ipreco" min="0"></p>

        <p><label for="iquant">Quantidade: </label>
        <input type="number" name="quant" id="iquant" required min="0" max="10"></p>

        <p><label for="itot">Total: </label>
        <output name="total" id="itot">0</output></p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
