<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            
        }

        form{
            width: 350px;
            border: 1px solid black;
            border-radius: 5px;
            box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.575);
            padding: 10px;
            margin: auto;
            display: block;
        }

        
    </style>
</head>
<body>
    <h1>Exemplos de Formulário</h1>
    <form action="cadastro.php" method="post">

        <label for="inum">Numero</label>
        <input type="range" name="num" id="inum" min="0" max="100" value="50" oninput="ival.innerHTML = Number(inum.value)">

        <output name="val" id="ival">50</output>

       <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
    </body>
</html>
