<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }

        form{
            width: 350px;
            border: 1px solid black;
            border-radius: 5px;
            box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.575);
            padding: 10px;
            margin: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.php" method="get">

        <p>
            <label for="in1">Número: </label>
            <input type="number" name="n1" id="in1" max="999999999" min="0" required oninput="isoma.innerHTML=Number(in1.value) + Number(in2.value)">
        </p>
        <!-- Aqui utilizamos o oninput, para que o input n1 some com o input n2. -->

        <!-- Esse codigo do oninput tem que ser colocado nos dois label, n1 e n2 para que o output funcione. -->
        <p>
            <label for="in2">Número: </label>
            <input type="number" name="n1" id="in2" max="999999999" min="0" required oninput="isoma.innerHTML=Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="isoma">Soma: </label>
            <output name="soma" id="isoma">0</output>
            <!-- Criamos o output 'soma' com o id 'isoma' com o valor '0'. Após isso adicionamos o 'oninput= 'isoma', utilizanso javascript.-->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
