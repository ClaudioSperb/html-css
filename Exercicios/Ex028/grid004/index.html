<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        *{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold;
        }
        div.container{
            
            text-align: center;      
            display: grid;
            gap: 10px;
            grid-auto-rows: 100px;
            grid-auto-columns: 100px;
            grid-auto-flow: row;

            /* Aqui colocamos o o 'grid-auto-flow', para alterar o fluxo da parte inplicita, ou seja , quando criado uma nova área dentro do container explicito, ele será criado e tera a configuração que for definida no 'grid-auto-row ou column' e no fluxo 'grid-auto-flow - row (Padrão) ou Column' */

            grid-template-rows: repeat(3, 200px);
            grid-template-columns: repeat(4, 1fr);

            place-items: normal normal;
            place-content: normal normal;

            /* Lembrando que sempre a ordem vem o aligne e depois o justify */
           
            
        }

        div.caixa1{
            display: grid;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;

            background-image: linear-gradient(to bottom, blue, rgb(3, 3, 80));
            border: 2px solid black;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.63);
        }

        div.caixa2{
            display: grid;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;

            background-image: linear-gradient(to bottom, rgb(46, 46, 252), rgb(164, 164, 235));
            border: 2px solid black;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.63);
        }

        div.caixa3{
            display: grid;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;

            background-image: linear-gradient(to bottom, rgb(160, 180, 224), rgb(110, 110, 224));
            border: 2px solid black;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.63);
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa 2</div>
        <div class="caixa3">Caixa 3</div>
    </div>
</body>
</html>
