<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            
            height: 500px;
            
            display: grid;
            grid-template-columns: 150px 150px 150px;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;
            align-items: center;
            justify-items:center;
            align-content: end;
            justify-content: space-between;

            text-align: center;
            
        }

        div.itens{
            border: 3px solid red;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.63);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
    </div>
</body>
</html>
