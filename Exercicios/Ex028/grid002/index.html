<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            text-align: center;
            height: 500px;
            
            display: grid;
            gap: 10px;
            grid-template: repeat(3, 100px) / repeat(3, 150px);
            /* Aqui simplificamos usando o repeat, lembrando que sempre a ordem é row e depois o column. */
            place-items: normal normal;
            place-content: center center;

            /* Lembrando que sempre a ordem vem o aligne e depois o justify */
           
            
        }

        div.itens{
            border: 3px solid red;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.63);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
    </div>
</body>
</html>
