<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{

            background-color: aquamarine;
            display: flex;
            flex-flow: row wrap;

            /* No container sempre será o display: "Flex" */
        }

        div.item{

            background-color: rgba(165, 42, 42, 0.651);
            color: white;
            border: 1px solid black;
            padding: 10px;
            text-align: center;

            /* O Item, os filhos no caso, sempre serão o Flex: "Auto" - ou outra ramificação da propriedade Flex. */

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
