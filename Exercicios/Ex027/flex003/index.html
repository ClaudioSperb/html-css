<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            width: 90vw;
            height: 80vh;

            background-color: aquamarine;
            display: flex;
            flex-direction: column-reverse;
            flex-wrap: wrap-reverse;

            /* Flex-flow = flex-direction + flex-wrap */
            

            /* No container sempre será o display: "Flex" */
        }

        div.item{

            background-color: rgba(165, 42, 42, 0.651);
            color: white;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            
            

            /* O Item, os filhos no caso, sempre serão o Flex: "Auto" - ou outra ramificação da propriedade Flex. */

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        <div class="item">Exemplo de Bloco D</div>
        <div class="item">Exemplo de Bloco E</div>
        <div class="item">Exemplo de Bloco F</div>
        <div class="item">Exemplo de Bloco G</div>
    </div>
</body>
</html>
