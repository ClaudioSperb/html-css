<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{

            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;
            

          
            
        }

        div.item{

            background-color: rgba(165, 42, 42, 0.651);
            color: white;
            border: 1px solid black;
            flex-basis: 230px;
            text-align: center;
            flex-shrink: 0;
            flex-grow: 0;

            

        }

        div#cxA{
            flex-grow: 0;
            flex-shrink: 4;
        }

        div#cxB{
        flex-grow: 2;
        flex-shrink: 2;
        }

        div#cxC{
        flex-grow: 4;
        flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
    
</body>
</html>
