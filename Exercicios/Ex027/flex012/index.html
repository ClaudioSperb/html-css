<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{

            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{

            background-color: rgba(29, 64, 219, 0.651);
            color: white;
            border: 1px solid black;
            text-align: center;


            

        }

        div#cxA{

        /* flex-grow: 0;
        flex-shrink: 4;
        flex-basis: 230px; */

        flex: 0 4 230px;

        }

        div#cxB{

        /* flex-grow: 2;
        flex-shrink: 2;
        flex-basis: 230px; */

        flex: 2 2 230px;
        }

        div#cxC{

        /* flex-grow: 4;
        flex-shrink: 1;
        flex-basis: auto; */

        flex: 4 1 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
    
</body>
</html>
